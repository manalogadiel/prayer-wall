name: prayer_wall
description: A warm, social space for prayer and thanksgiving.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  shared_preferences: ^2.5.6
  image_picker: 1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/illustrations/characters/
    - assets/illustrations/objects/
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit.ttf
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans.ttf
